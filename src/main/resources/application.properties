spring.application.name=sb-ecom

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

project.image=images/

spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=3000000
spring.app.jwtCookieName=springBootEcom

#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.com.ecommerce.project=DEBUG

#server.port=5000

frontend.url=http://localhost:5173/
image.base.url=http://localhost:8080/images/

stripe.secret.key=${STRIPE_SECRET_KEY}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dummy_cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:dummy_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:dummy_secret}
jwt.secret=${JWT_SECRET:dummy_jwt_secret_key_that_is_long_enough_for_hs256}